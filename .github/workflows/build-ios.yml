
name: Lost Chapter 0.7 - Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Verify Apple tools
        run: xcodebuild -version

      - name: Install project generator
        run: brew install xcodegen

      - name: Convert user supplied GLB or FBX models if present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for model in guardian infected; do
            if [ -s "Resources/Models.scnassets/$model.obj" ]; then
              echo "Bundled textured OBJ ready for $model"
              continue
            fi
            for src in OriginalModels/"$model".glb OriginalModels/"$model".gltf OriginalModels/"$model".fbx OriginalModels/"$model".obj; do
              if [ -f "$src" ]; then
                if ! command -v assimp >/dev/null 2>&1; then
                  brew install assimp
                fi
                assimp export "$src" "$RUNNER_TEMP/$model.dae" -fcollada
                test -s "$RUNNER_TEMP/$model.dae"
                cp "$RUNNER_TEMP/$model.dae" "Resources/Models.scnassets/$model.dae"
                break
              fi
            done
          done

      - name: Verify required game assets
        run: |
          test -s Resources/Models.scnassets/guardian.obj
          test -s Resources/Models.scnassets/infected.obj
          test -s Resources/Models.scnassets/main_land.obj
          test -s Resources/Models.scnassets/tubby_custard.obj
          test -s Resources/Audio/tinky_appearance.mp3
          test -s App/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile iPhone app (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project LostChapter.xcodeproj \
            -scheme LostChapter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA for Signulous
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/LostChapter.app"
          test -d "$APP"
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -q -r ../LostChapter-unsigned.ipa Payload
          cd ..
          test -s LostChapter-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LostChapter-0.7-unsigned-IPA
          path: LostChapter-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-log
          path: build.log
          if-no-files-found: ignore
