
name: Lost Chapter 0.7 - Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unpack source ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Slendytubbies_Lost_Chapter_iPhone_0.7_Source_and_Build.zip"
          if [ -f "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -oq "$ZIP" -d .
          else
            echo "No ZIP found: checking for already extracted project files"
          fi
          if [ ! -s "Resources/Models.scnassets/guardian.obj" ]; then
            echo "::error::Missing Resources/Models.scnassets/guardian.obj. Upload the full 0.7 ZIP at the repository root (not only the YAML)."
            exit 1
          fi

      - name: Verify Apple tools
        run: xcodebuild -version

      - name: Install project generator
        run: brew install xcodegen

      - name: Verify required game assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            project.yml \
            App/HorrorGameViewController.swift \
            Resources/Models.scnassets/guardian.obj \
            Resources/Models.scnassets/infected.obj \
            Resources/Models.scnassets/main_land.obj \
            Resources/Models.scnassets/tubby_custard.obj \
            Resources/Audio/tinky_appearance.mp3 \
            App/Assets.xcassets/AppIcon.appiconset/AppIcon.png; do
              if [ ! -s "$asset" ]; then
                echo "::error::Missing required file: $asset"
                exit 1
              fi
          done

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile iPhone app unsigned
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project LostChapter.xcodeproj \
            -scheme LostChapter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/LostChapter.app"
          test -d "$APP"
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -q -r ../LostChapter-unsigned.ipa Payload
          cd ..
          test -s LostChapter-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LostChapter-0.7-unsigned-IPA
          path: LostChapter-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-log
          path: build.log
          if-no-files-found: ignore
