
name: Lost Chapter 0.7 - Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unpack source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Slendytubbies_Lost_Chapter_iPhone_0.7_Source_and_Build.zip"
          if [ -f "$ZIP" ]; then
            unzip -oq "$ZIP" -d .
          fi
          test -s Resources/Models.scnassets/guardian.obj

      - name: Fix Swift compilation error
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('App/HorrorGameViewController.swift')
          data = p.read_text(encoding='utf-8')
          original = '            var low = SCNVector3Zero\n            var high = SCNVector3Zero\n            if parent.getBoundingBoxMin(&low, max: &high) {'
          replacement = '            let bounds = parent.boundingBox\n            let low = bounds.min\n            let high = bounds.max\n            if high.y > low.y {'
          if original in data:
              p.write_text(data.replace(original, replacement, 1), encoding='utf-8')
              print('SceneKit API fixed')
          elif replacement not in data:
              raise SystemExit('Expected code not found')
          PYFIX

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify assets
        run: |
          for asset in \
            project.yml \
            App/HorrorGameViewController.swift \
            Resources/Models.scnassets/guardian.obj \
            Resources/Models.scnassets/infected.obj \
            Resources/Models.scnassets/main_land.obj \
            Resources/Models.scnassets/tubby_custard.obj \
            Resources/Audio/tinky_appearance.mp3 \
            App/Assets.xcassets/AppIcon.appiconset/AppIcon.png; do
              test -s "$asset" || exit 1
          done

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project LostChapter.xcodeproj \
            -scheme LostChapter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/LostChapter.app"
          test -d "$APP"
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -q -r ../LostChapter-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LostChapter-0.7-unsigned-IPA
          path: LostChapter-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-log
          path: build.log
          if-no-files-found: ignore
